# Classic 4x4 Wumpus world from AIMA (Figure 7.2).
# (1, 1) is the bottom-left cave. The agent starts there, facing east.

# 4 | .  .  .  .
# 3 | G  W  P  .
# 2 | P  .  P  .
# 1 | >  .  .  .
#     1  2  3  4

grid:
  width: 4
  height: 4

agent:
  start: [1, 1]
  direction: east
  arrows: 1

wumpus: [4, 3]

pits:
  - [1, 4]
  - [2, 4]
  - [3, 4]

gold: [4, 4]

scoring:
  gold: 1000
  death: -1000
  step: -1
  shoot: -10

max_steps: 200
